[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siteguard-community"
version = "0.1.0"
description = "Offline static security checks for local Python projects"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["siteguard*"]
